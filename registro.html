<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Crear cuenta en ClothingFinder">
  <title>Crear cuenta | ClothingFinder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --azul: #102748;
      --azul2: #087ff5;
      --texto: #26344a;
      --suave: #75839a;
      --borde: #e5e8ee;
      --blanco: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--blanco);
      color: var(--texto);
      font-family: Inter, Arial, sans-serif;
      font-size: 13px;
    }

    .acceso-pantalla {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--blanco);
    }

    .acceso-lateral {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(28px, 7vw, 100px);
      color: var(--blanco);
      background: radial-gradient(ellipse at bottom left, #292116 0%, #101010 45%, #050607 100%);
    }

    .acceso-texto {
      max-width: 560px;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 30px;
      color: var(--blanco);
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
    }

    .marca-icono {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border-radius: 10px;
      background: var(--azul2);
      color: var(--blanco);
    }

    .logo-svg {
      display: block;
      width: 21px;
      height: 21px;
    }

    .acceso-texto h2 {
      margin-bottom: 18px;
      color: var(--blanco);
      font-size: clamp(26px, 3vw, 42px);
      line-height: 1.2;
      font-weight: 700;
    }

    .acceso-texto p {
      margin: 0;
      color: #e6e6e6;
      font-size: 16px;
      line-height: 1.8;
    }

    .acceso-pasos {
      margin-top: 26px;
      color: #d4d4d4;
      font-size: 14px;
      line-height: 2;
    }

    .acceso-principal {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(24px, 5vw, 76px);
    }

    .acceso-formulario {
      width: 100%;
      max-width: 650px;
    }

    .acceso-formulario h1 {
      margin-bottom: 7px;
      color: var(--azul);
      font-size: 28px;
      font-weight: 700;
    }

    .subtitulo-acceso {
      margin-bottom: 34px;
      color: var(--suave);
    }

    .form-label {
      margin-bottom: 5px;
      color: var(--texto);
      font-size: 13px;
      font-weight: 500;
    }

    .form-control,
    .form-select {
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid #dfe5ee;
      border-radius: 6px;
      font-size: 13px;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: #91a8c8;
      box-shadow: 0 0 0 .2rem #25467516;
    }

    .form-check-label {
      color: var(--texto);
      font-size: 12px;
    }

    .btn-azul {
      width: 100%;
      padding: 10px;
      border-color: var(--azul2);
      background: var(--azul2);
      color: var(--blanco);
      font-size: 13px;
      border-radius: 6px;
    }

    .btn-azul:hover {
      border-color: #066bd0;
      background: #066bd0;
      color: var(--blanco);
    }

    .enlace-login {
      display: block;
      margin-top: 18px;
      color: var(--azul2);
      text-align: center;
      text-decoration: none;
      font-size: 12px;
    }

    .enlace-login:hover {
      text-decoration: underline;
    }

    @media (max-width: 800px) {
      .acceso-pantalla {
        grid-template-columns: 1fr;
      }

      .acceso-lateral {
        min-height: auto;
        padding: 34px 24px;
      }

      .acceso-texto h2 {
        font-size: 26px;
      }

      .acceso-pasos {
        margin-top: 12px;
      }

      .acceso-principal {
        padding: 30px 20px;
      }
    }

    @media (max-width: 480px) {
      .acceso-formulario h1 {
        font-size: 24px;
      }

      .acceso-formulario .row > div {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="acceso-pantalla">
    <section class="acceso-lateral">
      <div class="acceso-texto">
        <a class="marca" href="index.html">
          <span class="marca-icono">
            <svg class="logo-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.5 8.5h11l.8 11h-12.6l.8-11Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
              <path d="M9 8.5V6.8a3 3 0 0 1 6 0v1.7M9.5 12.2l2.5 2.2 2.5-2.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span>ClothingFinder</span>
        </a>

        <h2>Tu estilo, tu camino.</h2>
        <p>Únete a nuestra comunidad y encuentra tus tiendas favoritas cerca de ti.</p>

        <div class="acceso-pasos">
          01 · Crea tu cuenta<br>
          02 · Elige tus estilos favoritos<br>
          03 · Empieza a explorar tiendas
        </div>
      </div>
    </section>

    <section class="acceso-principal">
      <div class="acceso-formulario">
        <h1>Crear cuenta</h1>
        <p class="subtitulo-acceso">Regístrate para descubrir tiendas y prendas cerca de ti.</p>

        <form action="login.html">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label" for="nombre">Nombre completo</label>
              <input id="nombre" class="form-control" type="text" placeholder="Ej. Laura Gómez" required>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label" for="correo-reg">Correo electrónico</label>
              <input id="correo-reg" class="form-control" type="email" placeholder="nombre@correo.com" required>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label" for="telefono">Teléfono</label>
              <input id="telefono" class="form-control" type="tel" placeholder="300 000 0000">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label" for="tipo">Tipo de cuenta</label>
              <select id="tipo" class="form-select">
                <option>Cliente</option>
                <option>Propietario de tienda</option>
              </select>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label" for="clave">Contraseña</label>
              <input id="clave" class="form-control" type="password" minlength="8" placeholder="Mínimo 8 caracteres" required>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label" for="confirmar">Confirmar contraseña</label>
              <input id="confirmar" class="form-control" type="password" minlength="8" placeholder="Repite la contraseña" required>
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" required id="terminos">
            <label class="form-check-label" for="terminos">
              Acepto el tratamiento de datos y las condiciones de uso.
            </label>
          </div>

          <button class="btn btn-azul" type="submit">Crear cuenta</button>
          <a href="login.html" class="enlace-login">Ya tengo una cuenta</a>
        </form>
      </div>
    </section>
  </main>
</body>

</html>
